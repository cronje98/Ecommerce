<!DOCTYPE html>
<html>
<head>
    <title>Your Cart</title>
</head>

<body>
<button id="backButton">Back</button>
<br>
<h1>Your Cart</h1>



<div id="cart">
    Loading cart...
</div>

<h2 id="total"></h2>



<script>

    // Get the current user's ID
    const userId = sessionStorage.getItem("userId");

    const cartDiv = document.getElementById("cart");
    const totalDiv = document.getElementById("total");


    // Check that a user is logged in
    if (!userId) {

        cartDiv.textContent = "You are not logged in.";

    } else {

        // Get this user's cart
        fetch("/cart/" + userId)

            .then(response => {

                if (!response.ok) {
                    throw new Error("Could not load cart");
                }

                return response.json();

            })

            .then(cart => {

                // Empty cart
                if (cart.length === 0) {

                    cartDiv.textContent = "Your cart is empty.";
                    totalDiv.textContent = "";

                    return;
                }


                // Clear "Loading cart..."
                cartDiv.innerHTML = "";

                let total = 0;


                // Display each cart item
                cart.forEach(item => {

                    const cartItem = document.createElement("div");

                    cartItem.innerHTML = `
                        <h2>${item.productName}</h2>

                        <p>
                            Price: $${item.price.toFixed(2)}
                        </p>

                        <div>
                            <button type="button" class="decreaseButton">
                                −
                            </button>

                            <span class="quantity">
                                ${item.quantity}
                            </span>

                            <button type="button" class="increaseButton">
                                +
                            </button>
                        </div>

                        <p>
                            Subtotal: $${item.subtotal.toFixed(2)}
                        </p>

                        <button type="button" class="removeButton">
                            Remove
                        </button>

                        <hr>
                    `;

                    cartDiv.appendChild(cartItem);


                    // Quantity buttons
                    const decreaseButton =
                        cartItem.querySelector(".decreaseButton");

                    const increaseButton =
                        cartItem.querySelector(".increaseButton");

                    let quantity = item.quantity;


                    // Increase quantity
                    increaseButton.addEventListener("click", function() {

                        quantity++;

                        updateQuantity(item.cartId, quantity);

                    });


                    // Decrease quantity
                    decreaseButton.addEventListener("click", function() {

                        if (quantity > 1) {

                            quantity--;

                            updateQuantity(item.cartId, quantity);

                        }

                    });


                    // Remove item
                    const removeButton =
                        cartItem.querySelector(".removeButton");

                    removeButton.addEventListener("click", function() {

                        fetch(`/cart/${item.cartId}`, {
                            method: "DELETE"
                        })
                            .then(response => {

                                if (!response.ok) {
                                    throw new Error("Could not remove item");
                                }

                                window.location.reload();

                            })
                            .catch(error => {

                                console.error(error);

                                alert("Could not remove item.");

                            });

                    });


                    // Add this item's subtotal to total
                    total += item.subtotal;

                });


                // Display total
                totalDiv.textContent =
                    "Total: $" + total.toFixed(2);

            })

            .catch(error => {

                console.error(error);

                cartDiv.textContent =
                    "Could not load cart.";

            });

    }


    // Update quantity in database
    function updateQuantity(cartId, quantity) {

        fetch(`/cart/${cartId}`, {
            method: "PUT",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(quantity)
        })
            .then(response => {

                if (!response.ok) {
                    throw new Error("Could not update quantity");
                }

                // Reload cart so subtotal and total update
                window.location.reload();

            })
            .catch(error => {

                console.error(error);

                alert("Could not update quantity.");

            });

    }


    // Back button
    document.getElementById("backButton")
        .addEventListener("click", function() {

            window.history.back();

        });

</script>

</body>
</html>
